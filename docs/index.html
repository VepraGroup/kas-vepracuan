<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14213d">
  <meta name="robots" content="noindex, nofollow">
  <title>Kas VepraCuan</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314213d'/%3E%3Ctext x='32' y='43' font-size='30' font-family='Arial' font-weight='700' text-anchor='middle' fill='white'%3EVC%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <!-- Layar login -->
  <section id="login" class="login hidden">
    <div class="login-box">
      <div class="logo">VC</div>
      <h1>Kas VepraCuan</h1>
      <p class="muted">Masuk dengan akun Google yang sudah diberi izin.</p>
      <div id="gbtn"></div>
      <p id="login-err" class="err hidden"></p>
    </div>
  </section>

  <!-- Aplikasi -->
  <section id="app" class="hidden">
    <header class="topbar">
      <div class="brand"><span class="logo sm">VC</span> <span id="page-title">Beranda</span></div>
      <div class="who" id="who"></div>
    </header>
    <main id="view" class="view"></main>
    <nav class="bottomnav">
      <a href="#/beranda" data-nav="beranda"><span class="ic">⌂</span>Beranda</a>
      <a href="#/catat" data-nav="catat"><span class="ic">＋</span>Catat</a>
      <a href="#/transaksi" data-nav="transaksi"><span class="ic">☰</span>Transaksi</a>
      <a href="#/stok" data-nav="stok"><span class="ic">▦</span>Stok</a>
      <a href="#/lainnya" data-nav="lainnya"><span class="ic">⋯</span>Lainnya</a>
    </nav>
  </section>

  <div id="loading" class="loading hidden"><div class="spinner"></div><div id="loading-text">Memuat…</div></div>
  <div id="toast" class="toast hidden"></div>
  <div id="modal" class="modal hidden"><div class="modal-card" id="modal-card"></div></div>

  <script src="app.js"></script>
</body>
</html>
